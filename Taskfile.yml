# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  build-native:
    desc: Build the backend for GraalVM native image
    cmd: docker build -t ghcr.io/thermcampos/ledger-finance/backend:latest backend/

  db-up:
    desc: Starts Postgres database container
    cmd: export NGROK_AUTHTOKEN=1 && docker compose -f compose.yaml up -d ledger-db

  db-down:
    desc: Stops and remove Postgres database container
    cmd: export NGROK_AUTHTOKEN=1 && docker compose -f compose.yaml down ledger-db -v --remove-orphans

  dev-up:
    desc: Starts database, API and web app locally
    cmd: doppler run --project ledger-finance --config dev -- docker compose -f compose.yaml up -d

  dev-down:
    desc: Stops and remove database, API and web app containers
    cmd: export NGROK_AUTHTOKEN=1 && docker compose -f compose.yaml down -v --remove-orphans 

  quality-check-backend:
    desc: Backend quality gate, same as PR CI (scripts/check-backend.sh). Switches to java 25.0.5.1-graal via SDKMAN
    cmd: |
      bash -c '
        source $HOME/.sdkman/bin/sdkman-init.sh && \
        sdk use java 25.0.5.1-graal && \
        bash scripts/check-backend.sh
      '

  quality-check-frontend:
    desc: Frontend quality gate, same as PR CI (scripts/check-frontend.sh) - lint, build, test, contrast
    cmd: bash scripts/check-frontend.sh

  smoke-test-backend:
    desc: "Smoke test a backend image as prod runs it (Docker required). Usage: task smoke-test-backend [TAG=pr-123]"
    cmd: BACKEND_IMAGE=ghcr.io/thermcampos/ledger-finance/backend:{{.TAG | default "latest"}} bash scripts/smoke-test-backend.sh

  smoke-test-frontend:
    desc: "Smoke test a frontend image (Docker required). Usage: task smoke-test-frontend [TAG=pr-123]"
    cmd: FRONTEND_IMAGE=ghcr.io/thermcampos/ledger-finance/frontend:{{.TAG | default "latest"}} bash scripts/smoke-test-frontend.sh

