---

services:
  ledger_db:
    image: postgres:16
    container_name: ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ledger-network

  ledger_backend:
    image: rmcampos/ledger-backend:latest
    build: ./backend
    container_name: ledger-backend
    depends_on:
      ledger_db:
        condition: service_started
    environment:
      POSTGRES_DB: ledger
      POSTGRES_HOST: ledger_db
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
      - "5005:5005"
    healthcheck:
      test: curl -f http://localhost:8080/q/health
      interval: 1m30s
      timeout: 15s
      retries: 3
      start_period: 10s
    networks:
      - ledger-network

  ledger_frontend:
    image: rmcampos/ledger-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_BACKEND_SERVER: "/api/.."
        VITE_BUILD_NUMBER: "snapshot"
    container_name: ledger-frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_HOST: ledger_backend
    depends_on:
      - ledger_backend
    healthcheck:
      test: timeout 10s bash -c 'true > /dev/tcp/127.0.0.1/5173' || exit 1
      interval: 1m30s
      timeout: 15s
      retries: 3
      start_period: 10s
    networks:
      - ledger-network

volumes:
  pgdata:
networks:
  ledger-network:
    external: true
