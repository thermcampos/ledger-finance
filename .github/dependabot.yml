version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.smallrye*"
      test-dependencies:
        patterns:
          - "*test*"
          - "org.mockito*"
          - "io.rest-assured*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      bootstrap:
        patterns:
          - "bootstrap*"
          - "react-bootstrap*"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
