name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'frontend/src/**'
      - 'frontend/*.js'
      - 'frontend/*.json'
      - 'frontend/index.html'
      - 'frontend/Dockerfile'
      - '.github/workflows/frontend.yml'

env:
  DOCKER_IMAGE: "rmcampos/ledger-frontend"

jobs:
  build:
    runs-on: easynode-debian
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      - name: Run lint
        run: npm run lint
        working-directory: ./frontend

      - name: Generate version tag
        id: version
        run: |
          DATE=$(date +'%Y.%m.%d')
          TAG="v${DATE}.${{ github.run_number }}"
          BUILD_NUMBER="${DATE}.${{ github.run_id }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${TAG}"
          echo "Generated build number: ${BUILD_NUMBER}"

      - name: Run build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          VITE_BACKEND_SERVER: ${{ vars.BACKEND_SERVER_URL }}

      - name: Set up Docker Buildx
        run: docker buildx inspect --bootstrap

      - name: Setup Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Log in to Docker Hub
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_AT_SECRETS }}
        run: doppler run --config prd -- sh -c 'echo $DOCKERHUB_TOKEN | docker login -u rmcampos --password-stdin'

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          build-args: |
            VITE_BACKEND_SERVER=${{ vars.BACKEND_SERVER_URL }}
            VITE_BUILD_NUMBER=${{ steps.version.outputs.build_number }}

      - name: Output Docker image URLs
        run: |
          echo ""
          echo "=========================================="
          echo "🚀 Docker Images Published Successfully!"
          echo "=========================================="
          echo ""
          echo "App Image:"
          echo "  ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.tag }}"
          echo "  ${{ env.DOCKER_IMAGE }}:latest"
          echo ""
          echo "=========================================="
