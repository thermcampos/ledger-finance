# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:ledger}
quarkus.datasource.password=${POSTGRES_PASSWORD:ledger}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledger}


# Dev mode: let Hibernate manage the schema so you can iterate on entities freely.
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
# Live Reload enabled in dev mode
%dev.quarkus.live-reload.instrumentation=true
# Disable continuous testing in dev mode
%dev.quarkus.test.continuous-testing=disabled


# Prod: schema must be created via a real migration tool (add Flyway/Liquibase before shipping).
%prod.quarkus.hibernate-orm.database.generation=validate

# Security - Permit public endpoints and CORS preflight
quarkus.http.auth.permission.public.paths=/auth/login,/auth/signup,/q/health,/q/health/live,/q/health/ready
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.options.paths=/*
quarkus.http.auth.permission.options.methods=OPTIONS
quarkus.http.auth.permission.options.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated


# --- JWT ---
# Generate a key pair before first run:
#   openssl genrsa -out src/main/resources/privateKey.pem 2048
#   openssl rsa -in src/main/resources/privateKey.pem -pubout -out src/main/resources/publicKey.pem
mp.jwt.verify.issuer=https://ledger.app/issuer
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://ledger.app/issuer

# --- CORS (allow the Vite dev server) ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,https://flattop-depth-dropper.ngrok-free.dev
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# --- Misc ---
quarkus.http.port=8080

# Native build optimizations
%prod.quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces
