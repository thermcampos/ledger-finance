# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:ledger}
quarkus.datasource.password=${POSTGRES_PASSWORD:ledger}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ledger}


# Dev mode: let Hibernate manage the schema so you can iterate on entities freely.
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
# Live Reload enabled in dev mode
%dev.quarkus.live-reload.instrumentation=true
# Disable continuous testing in dev mode
%dev.quarkus.test.continuous-testing=disabled


# Test: in-memory H2 (the global postgres URL would otherwise disable Dev Services),
# schema from entities (Flyway stays prod-only), tiny rate limit so 429 is testable.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.ledger.llm.rate-limit-per-minute=5

# Prod: Flyway owns schema creation and migrations.
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.flyway.migrate-at-start=true

# Security - Permit public endpoints and CORS preflight
quarkus.http.auth.permission.public.paths=/auth/login,/auth/signup,/q/health,/q/health/live,/q/health/ready,/internal/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.options.paths=/*
quarkus.http.auth.permission.options.methods=OPTIONS
quarkus.http.auth.permission.options.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated


# --- JWT ---
# Generate a key pair before first run:
#   openssl genrsa -out src/main/resources/privateKey.pem 2048
#   openssl rsa -in src/main/resources/privateKey.pem -pubout -out src/main/resources/publicKey.pem
mp.jwt.verify.issuer=https://ledger.app/issuer
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://ledger.app/issuer

# --- CORS (allow the Vite dev server) ---
quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173,https://flattop-depth-dropper.ngrok-free.dev
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
%prod.quarkus.http.cors.origins=https://ledger-finance.darkroasted.vps-kinghost.net

# --- Misc ---
quarkus.http.port=8080

# --- Budgets ---
# "Today" for budget math (spend cut-off, days left, digest dates) — never the pod's UTC default.
ledger.budget.zone=America/Sao_Paulo

# --- LLM read-only API (/llm/**) ---
ledger.llm.rate-limit-per-minute=60

# --- Transaction import (PDF via Claude) ---
quarkus.rest-client.anthropic-api.url=https://api.anthropic.com
ledger.import.pdf.model=claude-haiku-4-5
ledger.anthropic.api-key=${ANTHROPIC_API_KEY:}
ledger.import.pdf.enabled=false

# --- Transactional email (Resend) — docs/adr/0002-transactional-email-via-resend.md ---
quarkus.rest-client.resend-api.url=https://api.resend.com
ledger.resend.api-key=${RESEND_API_KEY:}
ledger.email.from=Ledger <digest@ledger-finance.darkroasted.vps-kinghost.net>
# Off outside prod: the plain-text body is logged instead of sent.
ledger.email.enabled=false
%prod.ledger.email.enabled=true
# Base URL for links in emails (e.g. the digest footer's Profile link).
ledger.app.url=http://localhost:5173
%prod.ledger.app.url=https://ledger-finance.darkroasted.vps-kinghost.net

# --- Scheduled jobs (docs/adr/0001-scheduled-jobs-via-cronjob.md) ---
# Shared secret the daily-digest CronJob sends as X-Digest-Secret. Blank → endpoint always 403.
ledger.digest.trigger-secret=${DIGEST_TRIGGER_SECRET:}
%test.ledger.digest.trigger-secret=test-digest-secret

# Native build optimizations
%prod.quarkus.native.additional-build-args=-H:+ReportExceptionStackTraces
