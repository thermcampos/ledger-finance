---

services:
  ledger-db:
    image: postgres:16
    container_name: ledger-db
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 1m30s
      timeout: 15s
      retries: 3
      start_period: 10s

  ledger-backend:
    container_name: ledger-backend
    depends_on:
      ledger-db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ledger
      POSTGRES_HOST: ledger-db
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8080:8080"
      - "5005:5005"
    image: maven:3.9.12-eclipse-temurin-21
    entrypoint: './mvnw -ntp quarkus:dev -Dquarkus.http.host=0.0.0.0'
    working_dir: /app
    volumes:
      - "./backend:/app"
    healthcheck:
      test: curl -f http://localhost:8080/q/health
      interval: 1m30s
      timeout: 15s
      retries: 3
      start_period: 10s

  ledger-frontend:
    image: node:22.14-bookworm-slim
    volumes: 
      - "./frontend:/app"
    working_dir: /app
    container_name: ledger-frontend
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5173:5173"
    environment:
      BACKEND_HOST: ledger-backend
      NGROK: 1
      VITE_BACKEND_SERVER: "/api"
    entrypoint: sh -c "npm i --no-update-notifier && NGROK=1 npm run dev -- --host"
    depends_on:
      ledger-backend:
        condition: service_healthy
    healthcheck:
      test: timeout 10s bash -c 'true > /dev/tcp/127.0.0.1/5173' || exit 1
      interval: 1m30s
      timeout: 15s
      retries: 3
      start_period: 10s

  ledger-ngrok:
    container_name: ledger-ngrok
    image: ngrok/ngrok:3-alpine
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set}
    command:
      - http
      - --url=https://flattop-depth-dropper.ngrok-free.dev
      - ledger-frontend:5173
    ports:
      - "4040:4040"
    depends_on:
      ledger-frontend:
        condition: service_healthy

